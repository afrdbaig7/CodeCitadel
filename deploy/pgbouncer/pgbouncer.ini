;; CodeCitadel PgBouncer Configuration (Milestone R5)
;; Architectural Reference: Transaction pooling for high-concurrency multi-tenant control plane.

[databases]
;; Direct connection through PgBouncer to the primary PostgreSQL cluster.
;; pool_mode = transaction allows multiplexing thousands of incoming client connections
;; over a small pool of PostgreSQL backend connections.
codecitadel = host=postgres port=5432 dbname=codecitadel auth_user=codecitadel_app

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

;; Network and listener settings
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; Administration accounts
admin_users = pgbouncer_admin
stats_users = prometheus_exporter

;; ============================================================================
;; POOLING STRATEGY
;; ============================================================================
;; Transaction pooling releases the backend connection as soon as a transaction ends (COMMIT or ROLLBACK).
;; CRITICAL: CodeCitadel's database migrations and outbox workers use transaction-scoped
;; advisory locks (`select pg_advisory_xact_lock(...)`), which naturally release upon transaction completion
;; and are 100% safe in transaction pooling mode.
pool_mode = transaction

;; Connection capacity limits
max_client_conn = 10000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 3.0
max_db_connections = 100

;; Lifetime and recycling
server_idle_timeout = 600.0
server_lifetime = 3600.0
server_connect_timeout = 15.0
server_login_retry = 1.0
client_idle_timeout = 120.0
client_login_timeout = 60.0

;; Reset and health check
server_reset_query = DISCARD ALL
server_check_query = select 1;
server_check_delay = 30.0

;; Compatibility
;; In transaction pooling, client-side prepared statements are unsupported without pgbouncer 1.21+ statement tracking.
;; CodeCitadel's query layer formats parameterized queries cleanly without session-pinned named statements.
ignore_startup_parameters = extra_float_digits,application_name
