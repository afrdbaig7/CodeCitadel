apiVersion: apps/v1
kind: Deployment
metadata:
  name: codecitadel-api
  namespace: codecitadel
  labels:
    app.kubernetes.io/name: codecitadel-api
    app.kubernetes.io/part-of: codecitadel
    app.kubernetes.io/component: control-plane-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: codecitadel-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codecitadel-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/v1/metrics"
    spec:
      containers:
        - name: api
          image: codecitadel/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: STORAGE_DRIVER
              value: "postgres"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: codecitadel-secrets
                  key: database-url
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: codecitadel-secrets
                  key: valkey-url
            - name: S3_ENDPOINT
              value: "http://minio.codecitadel.svc.cluster.local:9000"
            - name: S3_BUCKET
              value: "codecitadel-artifacts"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: codecitadel-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: codecitadel-secrets
                  key: s3-secret-key
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: codecitadel-api
  namespace: codecitadel
  labels:
    app.kubernetes.io/name: codecitadel-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: codecitadel-api
