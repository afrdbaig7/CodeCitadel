apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codecitadel-worker-hpa
  namespace: codecitadel
  labels:
    app.kubernetes.io/name: codecitadel-worker-hpa
    app.kubernetes.io/component: orchestration-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codecitadel-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    # 1. Custom metric: Outbox queue backlog from Prometheus Adapter
    - type: External
      external:
        metric:
          name: codecitadel_outbox_pending_events
        target:
          type: AverageValue
          averageValue: "5"
    # 2. Resource metric: Worker CPU saturation
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    # 3. Resource metric: Worker memory saturation
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
      selectPolicy: Min
