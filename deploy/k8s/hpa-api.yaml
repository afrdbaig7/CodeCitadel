apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codecitadel-api-hpa
  namespace: codecitadel
  labels:
    app.kubernetes.io/name: codecitadel-api-hpa
    app.kubernetes.io/component: control-plane-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codecitadel-api
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Percent
          value: 50
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
      selectPolicy: Min
