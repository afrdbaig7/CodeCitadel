apiVersion: apps/v1
kind: Deployment
metadata:
  name: codecitadel-worker
  namespace: codecitadel
  labels:
    app.kubernetes.io/name: codecitadel-worker
    app.kubernetes.io/part-of: codecitadel
    app.kubernetes.io/component: orchestration-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: codecitadel-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codecitadel-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: codecitadel/worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: codecitadel-secrets
                  key: database-url
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: codecitadel-secrets
                  key: valkey-url
            - name: WORKER_POLL_INTERVAL_MS
              value: "500"
            - name: WORKER_BATCH_SIZE
              value: "10"
            - name: S3_ENDPOINT
              value: "http://minio.codecitadel.svc.cluster.local:9000"
            - name: S3_BUCKET
              value: "codecitadel-artifacts"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: codecitadel-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: codecitadel-secrets
                  key: s3-secret-key
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
